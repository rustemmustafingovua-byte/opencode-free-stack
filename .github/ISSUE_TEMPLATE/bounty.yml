name: 💰 Reward (fundable)
description: Report a bug or request a feature. Anyone can fund it with /reward <amount> (Opire) or via Algora.
labels: ["💰 Reward"]
body:
  - type: input
    id: problem
    attributes:
      label: Problem
      description: What is broken or missing?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps or a code snippet.
  - type: input
    id: amount
    attributes:
      label: Suggested reward (USDC)
      description: Optional. The reward is paid to whoever's PR gets merged — not to the repo owner.
    placeholder: "25"
